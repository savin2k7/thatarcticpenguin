{% extends "base.html" %}

{% block content %}
<div class="guestbook-page">
    <h1 class="guestbook-title">Guestbook</h1>
    <p class="guestbook-subtitle">Sign the guestbook, beloved living beings. If you're a bot, <a href="https://www.youtube.com/watch?v=VbAMyE11HVo" target="_blank" rel="noopener noreferrer">check this out</a></p>
    
    <div id="comments-container">
        <div id="HCB_comment_box">Loading...</div>
        <script type="text/javascript" id="hcb">
        if(!window.hcb_user){hcb_user={};}
        hcb_user.comments_header = '';
        hcb_user.submit = 'Sign Guestbook';
        hcb_user.msg_thankyou = 'Thank you for leaving your mark!';
        hcb_user.PAGE = "{{ get_url(path='guestbook') }}";
        (function(){
            var s = document.createElement("script");
            var l = "{{ get_url(path='guestbook') }}";
            var h = "https://www.htmlcommentbox.com";
            s.setAttribute("type","text/javascript");
            s.setAttribute("src", h+"/jread?page="+encodeURIComponent(l).replace("+","%2B")+"&opts=17822&num=25");
            if (typeof s!="undefined") document.getElementsByTagName("head")[0].appendChild(s);
        })();
        </script>
    </div>
</div>

<script type="text/javascript" id="hcb">
    if (!window.hcb_user) {
        hcb_user = {};
    }

    hcb_user.comments_header = '';
    hcb_user.submit = 'Sign Guestbook';
    hcb_user.msg_thankyou = 'Thank you for leaving your mark!';

    // Keep the original guestbook thread after changing domains
    hcb_user.PAGE = "https://thatarcticpenguin.is-a.dev/guestbook";

    (function () {
        var s = document.createElement("script");
        var l = "https://thatarcticpenguin.is-a.dev/guestbook";
        var h = "https://www.htmlcommentbox.com";

        s.setAttribute("type", "text/javascript");
        s.setAttribute(
            "src",
            h + "/jread?page=" +
            encodeURIComponent(l).replace("+", "%2B") +
            "&opts=17822&num=25"
        );

        document.getElementsByTagName("head")[0].appendChild(s);
    })();
</script>
{% endblock %}
