{% extends "base.html" %}
{% block content %}
<div class="container">
    <h1 class="garden-title">The Garden</h1>
    <p class="garden-subtext">The garden is a collection of movies and tv shows i have watched and their ratings out of 10. This is based on my personal experience and has no relation to IMdB. (totally unbiased fs)</p>
    <div class="garden-filters">
        <button class="garden-filter-btn button-secondary" data-filter="all">All</button>
        <button class="garden-filter-btn button-primary" data-filter="anime">Anime</button>
        <button class="garden-filter-btn button-primary" data-filter="tv">TV</button>
        <button class="garden-filter-btn button-primary" data-filter="movies">Movies</button>
        <button class="garden-filter-btn button-primary" data-filter="books">Books</button>
        <button class="garden-filter-btn button-primary" data-filter="games">Games</button>
    </div>

    <div class="garden-grid">
        <img src="/odyssey.jpg" width="220" height="350" data-threshold="25" data-rating="9.5/10" data-category="movies" class="threshold-hover" alt="Odyssey Banner">
        <img src="/projecthailmary.jpg" width="220" height="350" data-threshold="70" data-rating="9.6/10" data-category="movies" class="threshold-hover" alt="Project Hail Mary Banner">
        <img src="/avatarwayofwater.jpg" width="220" height="350" data-threshold="90" data-rating="8.2/10" data-category="movies" class="threshold-hover" alt="Avatar: The Way of Water Banner">
        <img src="/httyd.jpg" width="220" height="350" data-threshold="80" data-rating="9.4/10" data-category="movies" class="threshold-hover" alt="How to Train Your Dragon Banner">
        <img src="/f1themovie.jpg" width="220" height="350" data-threshold="200" data-rating="8.8/10" data-category="movies" class="threshold-hover" alt="F1 The Movie Banner">
        <img src="/findingnemo.jpg" width="220" height="350" data-threshold="120" data-rating="9.0/10" data-category="movies" class="threshold-hover" alt="Finding Nemo Banner">
        <img src="/dhurandhar.jpg" width="220" height="350" data-threshold="70" data-rating="9.1/10" data-category="movies" class="threshold-hover" alt="Dhurandhar Banner">
        <img src="/loki.jpg" width="220" height="350" data-threshold="70" data-rating="9.1/10" data-category="tv" class="threshold-hover" alt="Loki Banner">
        <img src="/spidermanbnd.jpg" width="220" height="350" data-threshold="80" data-rating="9.2/10" data-category="movies" class="threshold-hover" alt="Spider-Man: No Way Home Banner">
        <img src="/sloplevelling.jpg" width="220" height="350" data-threshold="90" data-rating="slop/10" data-category="anime" class="threshold-hover" alt="Slop Levelling Banner">
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const filterButtons = document.querySelectorAll('.garden-filter-btn');

    filterButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            const filter = btn.dataset.filter.toLowerCase();

            // Update active button state
            filterButtons.forEach(b => {
                b.classList.remove('button-secondary');
                b.classList.add('button-primary');
            });
            btn.classList.remove('button-primary');
            btn.classList.add('button-secondary');

            // Show / hide garden grid elements
            const items = document.querySelectorAll('.garden-grid > *');
            items.forEach(item => {
                const cat = (item.dataset.category || '').toLowerCase();
                if (filter === 'all' || cat === filter) {
                    item.style.display = '';
                } else {
                    item.style.display = 'none';
                }
            });
        });
    });
});
</script>

<p class="built-with">built with <a href="https://www.getzola.org/" target="_blank" rel="noopener">zola</a></p>
{% endblock %}
